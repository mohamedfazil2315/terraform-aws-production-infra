<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>AWS 3-Tier Architecture Diagram</title>
<desc>A production-grade AWS infrastructure with VPC, public subnets for the web tier, private subnets for the database tier, load balancer, EC2 instances, and RDS database across multiple availability zones.</desc>

<defs>
<style>
.vpc-bg { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
.public-subnet { fill: #FAEEDA; stroke: #BA7517; stroke-width: 0.5; }
.private-subnet { fill: #FCEBEB; stroke: #A32D2D; stroke-width: 0.5; }
.alb-box { fill: #FAECE7; stroke: #D85A30; stroke-width: 0.5; }
.igw-box { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.ec2-box { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.5; }
.rds-box { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
.box-title { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.box-subtitle { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #888780; }
.label { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.section-title { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; fill: #3C3489; }
.arrow { stroke: #185FA5; stroke-width: 1.5; fill: none; }
.data-arrow { stroke: #185FA5; stroke-width: 1.5; fill: none; stroke-dasharray: 3,3; }
@media (prefers-color-scheme: dark) {
  .vpc-bg { fill: #0C447C; stroke: #B5D4F4; }
  .public-subnet { fill: #633806; stroke: #FAC775; }
  .private-subnet { fill: #501313; stroke: #F7C1C1; }
  .alb-box { fill: #712B13; stroke: #F5C4B3; }
  .igw-box { fill: #085041; stroke: #9FE1CB; }
  .ec2-box { fill: #27500A; stroke: #C0DD97; }
  .rds-box { fill: #3C3489; stroke: #CECBF6; }
  .box-title { fill: #E8E6DC; }
  .box-subtitle { fill: #C2C0B6; }
  .label { fill: #9C9A92; }
  .section-title { fill: #AFA9EC; }
  .arrow { stroke: #B5D4F4; }
  .data-arrow { stroke: #B5D4F4; }
}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- VPC Container -->
<rect class="vpc-bg" x="60" y="30" width="600" height="550" rx="12"/>
<text class="box-title" x="80" y="55">Amazon VPC (10.0.0.0/16)</text>
<text class="box-subtitle" x="80" y="72">Multi-AZ deployment with public and private subnets</text>

<!-- Internet Gateway -->
<rect class="igw-box" x="510" y="90" width="120" height="50" rx="6"/>
<text class="box-title" x="570" y="110" text-anchor="middle">Internet Gateway</text>
<text class="box-subtitle" x="570" y="128" text-anchor="middle">Public access</text>

<!-- Application Load Balancer -->
<rect class="alb-box" x="360" y="90" width="120" height="50" rx="6"/>
<text class="box-title" x="420" y="110" text-anchor="middle">Load Balancer</text>
<text class="box-subtitle" x="420" y="128" text-anchor="middle">Application tier</text>

<!-- Connection: IGW to ALB -->
<line x1="510" y1="115" x2="480" y2="115" class="arrow" marker-end="url(#arrow)"/>

<!-- PUBLIC SUBNET 1 (AZ-1) -->
<rect class="public-subnet" x="80" y="160" width="240" height="180" rx="8"/>
<text class="box-title" x="100" y="180">Public Subnet (AZ-1)</text>
<text class="box-subtitle" x="100" y="196">10.0.1.0/24</text>

<!-- EC2 Instance 1 -->
<rect class="ec2-box" x="100" y="210" width="200" height="56" rx="6"/>
<text class="box-title" x="200" y="228" text-anchor="middle">EC2 Web Server</text>
<text class="box-subtitle" x="200" y="246" text-anchor="middle">Application instance</text>

<!-- PUBLIC SUBNET 2 (AZ-2) -->
<rect class="public-subnet" x="360" y="160" width="240" height="180" rx="8"/>
<text class="box-title" x="380" y="180">Public Subnet (AZ-2)</text>
<text class="box-subtitle" x="380" y="196">10.0.2.0/24</text>

<!-- EC2 Instance 2 -->
<rect class="ec2-box" x="380" y="210" width="200" height="56" rx="6"/>
<text class="box-title" x="480" y="228" text-anchor="middle">EC2 Web Server</text>
<text class="box-subtitle" x="480" y="246" text-anchor="middle">Application instance</text>

<!-- Connections: ALB to EC2 instances -->
<path d="M420 140L200 210" class="arrow" marker-end="url(#arrow)"/>
<path d="M420 140L480 210" class="arrow" marker-end="url(#arrow)"/>

<!-- PRIVATE SUBNET 1 (AZ-1) -->
<rect class="private-subnet" x="80" y="370" width="240" height="180" rx="8"/>
<text class="box-title" x="100" y="390">Private Subnet (AZ-1)</text>
<text class="box-subtitle" x="100" y="406">10.0.3.0/24</text>

<!-- PRIVATE SUBNET 2 (AZ-2) -->
<rect class="private-subnet" x="360" y="370" width="240" height="180" rx="8"/>
<text class="box-title" x="380" y="390">Private Subnet (AZ-2)</text>
<text class="box-subtitle" x="380" y="406">10.0.4.0/24</text>

<!-- RDS Database -->
<rect class="rds-box" x="180" y="410" width="220" height="70" rx="6"/>
<text class="box-title" x="290" y="433" text-anchor="middle">RDS MySQL Database</text>
<text class="box-subtitle" x="290" y="451" text-anchor="middle">Multi-AZ deployment</text>
<text class="box-subtitle" x="290" y="467" text-anchor="middle">Encrypted, automated backups</text>

<!-- Connections: EC2 to RDS (data flow) -->
<path d="M200 266L290 410" class="data-arrow" marker-end="url(#arrow)"/>
<path d="M480 266L290 410" class="data-arrow" marker-end="url(#arrow)"/>

<!-- Route Table Labels -->
<text class="section-title" x="320" y="150">Public Route Table</text>
<text class="section-title" x="320" y="360">Private Route Table</text>

<!-- Architecture Explanation -->
<text class="label" x="80" y="580">Three-tier architecture: Load balancer → Web/Application tier (Public) → Database tier (Private)</text>

</svg>
